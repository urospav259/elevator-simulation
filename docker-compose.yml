services:
  postgres:
    image: postgres:16-alpine
    container_name: elevator-simulation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: elevator_simulation
    ports:
      - "5432:5432"
    volumes:
      - elevator-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d elevator_simulation"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  elevator-postgres-data:
